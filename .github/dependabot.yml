version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    allow:
      - dependency-type: production
      # Toolchain majors require a coordinated peer-dependency migration.
      # This filter affects version updates, not security updates.
      - dependency-type: development
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: openai
        versions:
          - ">=7"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
